; WiFi bridge between a K3NG GS-232B rotator controller and the network.
; Target: LOLIN S3 Mini (ESP32-S3). See DESIGN.md for the architecture.

[platformio]
src_dir = src

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; Board default is 460800 - dropped for a flaky USB link that was corrupting
; esptool's sync/write (garbled/"noise" errors mid-upload). Safe to raise back
; once a board reliably flashes clean at a higher speed.
upload_speed = 115200
build_flags = -Wall
board_build.filesystem = littlefs
; Pinned instead of PlatformIO's own auto-picked default.csv - see
; partitions.csv's own header comment for why an unpinned scheme is a real
; risk to the config/favourites LittleFS holds.
board_build.partitions = partitions.csv
; Excludes the throwaway diagnostic sketch (env:diag_minimal owns it) - both
; define setup()/loop() and src_dir is shared across every environment.
build_src_filter = +<*> -<diag_minimal.cpp>
; No SoftwareSerial dependency: the ESP32 GPIO matrix puts a real hardware
; UART on whichever pins we like, which is one of the reasons for this board.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ; Already a transitive dependency of ESPAsyncWebServer; listed explicitly
    ; because AntennaSwitch.cpp uses its AsyncClient directly for a
    ; non-blocking HTTP client to ant-sw-2x6 (see AntennaSwitch.h).
    ESP32Async/AsyncTCP@^3.0.0

; Throwaway diagnostic build - bare Arduino + heartbeat LED, no WiFi, no
; AsyncTCP, no controller UART polling. Isolates whether the 3.3V regulator
; overheating comes from WiFi/network activity or is present even without it.
; Not part of the shipped firmware; delete once the regulator issue is solved.
[env:diag_minimal]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<diag_minimal.cpp>

; Host-side unit tests for the protocol layer. lib/gs232 has no Arduino
; dependency precisely so it can run here; PlatformIO does not build src/ for
; tests unless test_build_src is set, so main.cpp and friends stay out of it.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
